<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 260px;
      padding: 12px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      margin: 0;
    }
    h3 {
      margin: 0 0 10px 0;
      font-size: 14px;
      color: #333;
    }
    .field {
      margin-bottom: 10px;
    }
    label {
      display: block;
      margin-bottom: 4px;
      color: #555;
    }
    select, input[type="text"] {
      width: 100%;
      padding: 6px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      width: 100%;
      padding: 8px;
      background-color: #0066cc;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    button:disabled {
      background-color: #999;
      cursor: not-allowed;
    }
    #status {
      margin-top: 10px;
      padding: 6px;
      border-radius: 4px;
      display: none;
      word-break: break-all;
    }
    .success {
      background-color: #e6f4ea;
      color: #137333;
      display: block !important;
    }
    .error {
      background-color: #fce8e6;
      color: #c5221f;
      display: block !important;
    }
  </style>
</head>
<body>
  <h3>VPN Proxy 起動</h3>
  
  <div class="field">
    <label for="username">ユーザー選択:</label>
    <select id="username">
      <option value="ua">ua</option>
      <option value="ub">ub</option>
      <option value="uc">uc</option>
      <option value="ud">ud</option>
    </select>
  </div>

  <button id="sendBtn">Cookie 送信 & 起動</button>

  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>

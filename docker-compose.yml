services:
  # Orchestrator and Management Portal
  orchestrator:
    build:
      context: ./orchestrator
      dockerfile: Dockerfile
    image: tunnels-orchestrator:latest
    container_name: tunnels_orchestrator
    restart: unless-stopped
    networks:
      - n-tunnels
    ports:
      - "8000:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./worker:/app/worker:ro
    environment:
      - HOST_BASE_DOMAIN=${BASE_DOMAIN:-proxy.example.com}
      - DOCKER_NETWORK=vpn-proxy-tunnels_n-tunnels
      - DOCKER_SOCKET=/var/run/docker.sock
      - PROXY_PASS_UA=${PROXY_PASS_UA}
      - PROXY_PASS_UB=${PROXY_PASS_UB}
      - PROXY_PASS_UC=${PROXY_PASS_UC}
      - PROXY_PASS_UD=${PROXY_PASS_UD}

  # TLS CONNECT proxy ingress (SNI -> worker squid on 127.0.0.1:108x)
  proxy-ingress:
    image: nginx:1.27-alpine
    container_name: tunnels_proxy_ingress
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./ingress/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ingress/certs:/etc/nginx/certs:ro

  # Cloudflare Tunnel
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: tunnels_cloudflared
    restart: unless-stopped
    networks:
      - n-tunnels
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - orchestrator

networks:
  n-tunnels:
    driver: bridge

worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {}

stream {
    # HTTPS (TLS CONNECT) プロキシ終端 -> 各ワーカーの squid (127.0.0.1:108x)
    # SNI の server_name でユーザーを振り分け、PROXY protocol で元IPを引き継ぐ
    server {
        listen 443 ssl;
        server_name ua-proxy.proxaxis.me;
        ssl_certificate     /etc/nginx/certs/letsencrypt/live/ua-proxy.proxaxis.me/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/letsencrypt/live/ua-proxy.proxaxis.me/privkey.pem;
        proxy_protocol on;
        proxy_pass 127.0.0.1:1081;
    }
    server {
        listen 443 ssl;
        server_name ub-proxy.proxaxis.me;
        ssl_certificate     /etc/nginx/certs/letsencrypt/live/ua-proxy.proxaxis.me/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/letsencrypt/live/ua-proxy.proxaxis.me/privkey.pem;
        proxy_protocol on;
        proxy_pass 127.0.0.1:1082;
    }
    server {
        listen 443 ssl;
        server_name uc-proxy.proxaxis.me;
        ssl_certificate     /etc/nginx/certs/letsencrypt/live/ua-proxy.proxaxis.me/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/letsencrypt/live/ua-proxy.proxaxis.me/privkey.pem;
        proxy_protocol on;
        proxy_pass 127.0.0.1:1083;
    }
    server {
        listen 443 ssl;
        server_name ud-proxy.proxaxis.me;
        ssl_certificate     /etc/nginx/certs/letsencrypt/live/ua-proxy.proxaxis.me/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/letsencrypt/live/ua-proxy.proxaxis.me/privkey.pem;
        proxy_protocol on;
        proxy_pass 127.0.0.1:1084;
    }
}
